<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyChat</title>
<meta name="theme-color" content="#111">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#111; color:#eee; font-family:system-ui,-apple-system,sans-serif; overflow:hidden; }
  .screen { display:none; flex-direction:column; height:100dvh; }
  .screen.active { display:flex; }
  header { padding:12px 16px; background:#1a1a1a; border-bottom:1px solid #262626; display:flex; align-items:center; gap:10px; flex-shrink:0; }
  header img { width:32px; height:32px; border-radius:50%; }
  header b { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header button { background:#333; color:#eee; border:0; padding:8px 12px; border-radius:8px; font-size:14px; cursor:pointer; }
  header .back { background:transparent; padding:6px 10px; font-size:22px; line-height:1; }

  /* Login */
  #login { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100dvh; gap:20px; padding:24px; text-align:center; }
  #login button { padding:14px 24px; border-radius:12px; border:0; background:#fff; color:#111; font-size:16px; font-weight:600; cursor:pointer; }

  /* Rooms list */
  #roomsList { flex:1; overflow-y:auto; }
  .room { padding:14px 16px; border-bottom:1px solid #222; cursor:pointer; display:flex; align-items:center; gap:12px; }
  .room:active { background:#1a1a1a; }
  .room .avatar { width:44px; height:44px; border-radius:50%; background:#2b5278; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
  .room .info { flex:1; min-width:0; }
  .room .name { font-weight:600; margin-bottom:3px; }
  .room .last { font-size:13px; opacity:.6; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .room .time { font-size:11px; opacity:.5; flex-shrink:0; align-self:flex-start; padding-top:2px; }
  .empty { padding:40px 20px; text-align:center; opacity:.5; }

  /* Messages */
  #messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:78%; padding:8px 12px; border-radius:14px; background:#222; word-wrap:break-word; }
  .msg.mine { align-self:flex-end; background:#2b5278; }
  .msg small { display:block; opacity:.6; font-size:11px; margin-top:4px; }
  form { display:flex; gap:8px; padding:10px; background:#1a1a1a; border-top:1px solid #262626; flex-shrink:0; }
  form input { flex:1; padding:12px; border-radius:22px; border:0; background:#262626; color:#eee; font-size:15px; outline:none; }
  form button { padding:0 18px; border-radius:22px; border:0; background:#2b5278; color:#fff; font-size:15px; cursor:pointer; }

  /* Modal */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; align-items:center; justify-content:center; padding:20px; }
  .modal.active { display:flex; }
  .modal-box { background:#1a1a1a; padding:20px; border-radius:16px; width:100%; max-width:340px; }
  .modal-box h3 { margin:0 0 14px; }
  .modal-box input { width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#262626; color:#eee; font-size:15px; outline:none; }
  .modal-actions { display:flex; gap:8px; margin-top:14px; }
  .modal-actions button { flex:1; padding:12px; border-radius:10px; border:0; font-size:15px; font-weight:600; cursor:pointer; }
  .btn-primary { background:#2b5278; color:#fff; }
  .btn-secondary { background:#333; color:#eee; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <h1>MyChat</h1>
  <p style="opacity:.7">Войди, чтобы начать общаться</p>
  <button id="googleBtn">Войти через Google</button>
</div>

<!-- ROOMS LIST -->
<div id="roomsScreen" class="screen">
  <header>
    <img id="myAvatar" alt="">
    <b id="myName">…</b>
    <button id="newRoomBtn">+ Чат</button>
    <button id="logout">Выйти</button>
  </header>
  <div id="roomsList"></div>
</div>

<!-- CHAT -->
<div id="chatScreen" class="screen">
  <header>
    <button class="back" id="backBtn">←</button>
    <b id="roomName">…</b>
  </header>
  <div id="messages"></div>
  <form id="form">
    <input id="input" placeholder="Сообщение…" autocomplete="off" maxlength="500">
    <button>➤</button>
  </form>
</div>

<!-- CREATE ROOM MODAL -->
<div class="modal" id="newRoomModal">
  <div class="modal-box">
    <h3>Новый чат</h3>
    <input id="newRoomName" placeholder="Название комнаты" maxlength="40">
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelRoom">Отмена</button>
      <button class="btn-primary" id="createRoom">Создать</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, set, onChildAdded, onValue, serverTimestamp, query, limitToLast, orderByChild }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// 🔴 ТВОЙ КОНФИГ
const firebaseConfig = {
  apiKey: "AIzaSyA7W1Aa0-6ArSM3rJ1B-RsfXzkKnJlFbvg",
  authDomain: "mychat-9f629.firebaseapp.com",
  databaseURL: "https://mychat-9f629-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "mychat-9f629",
  storageBucket: "mychat-9f629.firebasestorage.app",
  messagingSenderId: "175226507843",
  appId: "1:175226507843:web:0be69688dbef0d4bd9baf6",
  measurementId: "G-4J4S8LSRSC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

const $ = id => document.getElementById(id);
let currentUser = null;
let currentRoomId = null;
let msgUnsub = null;

// === AUTH ===
$('googleBtn').onclick = () => signInWithPopup(auth, provider);
$('logout').onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (!user) {
    $('login').style.display = 'flex';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    return;
  }
  $('login').style.display = 'none';
  $('myName').textContent = user.displayName || user.email;
  $('myAvatar').src = user.photoURL || '';
  showScreen('roomsScreen');
  loadRooms();
});

// === SCREENS ===
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

// === ROOMS ===
function loadRooms() {
  const list = $('roomsList');
  const roomsRef = ref(db, 'rooms');
  onValue(roomsRef, snap => {
    list.innerHTML = '';
    const rooms = snap.val() || {};
    const arr = Object.entries(rooms).map(([id, r]) => ({ id, ...r }));
    arr.sort((a, b) => (b.lastTime || 0) - (a.lastTime || 0));

    if (arr.length === 0) {
      list.innerHTML = '<div class="empty">Пока нет комнат.<br>Нажми «+ Чат», чтобы создать первую.</div>';
      return;
    }

    arr.forEach(room => {
      const div = document.createElement('div');
      div.className = 'room';
      const initial = (room.name || '?')[0].toUpperCase();
      const last = room.lastMessage ? esc(room.lastMessage).slice(0, 60) : 'Нет сообщений';
      const who = room.lastName ? esc(room.lastName) + ': ' : '';
      const t = room.lastTime ? timeShort(room.lastTime) : '';
      div.innerHTML = `
        <div class="avatar">${initial}</div>
        <div class="info">
          <div class="name">${esc(room.name)}</div>
          <div class="last">${who}${last}</div>
        </div>
        <div class="time">${t}</div>
      `;
      div.onclick = () => openRoom(room.id, room.name);
      list.appendChild(div);
    });
  });
}

// === CREATE ROOM ===
$('newRoomBtn').onclick = () => {
  $('newRoomName').value = '';
  $('newRoomModal').classList.add('active');
  setTimeout(() => $('newRoomName').focus(), 100);
};
$('cancelRoom').onclick = () => $('newRoomModal').classList.remove('active');
$('newRoomModal').onclick = e => { if (e.target.id === 'newRoomModal') $('newRoomModal').classList.remove('active'); };

$('createRoom').onclick = async () => {
  const name = $('newRoomName').value.trim();
  if (!name) return;
  const r = push(ref(db, 'rooms'));
  await set(r, {
    name,
    createdBy: currentUser.uid,
    createdAt: serverTimestamp(),
    lastTime: Date.now()
  });
  $('newRoomModal').classList.remove('active');
  openRoom(r.key, name);
};
$('newRoomName').onkeydown = e => { if (e.key === 'Enter') $('createRoom').click(); };

// === OPEN ROOM ===
function openRoom(roomId, roomName) {
  currentRoomId = roomId;
  $('roomName').textContent = roomName;
  showScreen('chatScreen');

  const msgsEl = $('messages');
  msgsEl.innerHTML = '';

  if (msgUnsub) msgUnsub();

  const q = query(ref(db, `messages/${roomId}`), limitToLast(200));
  msgUnsub = onChildAdded(q, snap => {
    const m = snap.val();
    const div = document.createElement('div');
    div.className = 'msg' + (m.uid === currentUser.uid ? ' mine' : '');
    const t = m.time ? new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
    div.innerHTML = `<div style="font-size:12px;opacity:.75">${esc(m.name)}</div>${esc(m.text)}<small>${t}</small>`;
    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  });
}

$('backBtn').onclick = () => {
  if (msgUnsub) { msgUnsub(); msgUnsub = null; }
  currentRoomId = null;
  showScreen('roomsScreen');
};

// === SEND MESSAGE ===
$('form').onsubmit = async e => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text || !currentRoomId) return;
  $('input').value = '';

  await push(ref(db, `messages/${currentRoomId}`), {
    uid: currentUser.uid,
    name: currentUser.displayName || currentUser.email,
    text,
    time: Date.now()
  });

  // Обновляем последнее сообщение в комнате
  await set(ref(db, `rooms/${currentRoomId}/lastMessage`), text.slice(0, 100));
  await set(ref(db, `rooms/${currentRoomId}/lastName`), currentUser.displayName || currentUser.email);
  await set(ref(db, `rooms/${currentRoomId}/lastTime`), Date.now());
};

// === HELPERS ===
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function timeShort(ts) {
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  }
  return d.toLocaleDateString([], {day:'2-digit', month:'2-digit'});
}
</script>
</body>
</html>
