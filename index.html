<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyChat</title>
<meta name="theme-color" content="#17212b">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#0e1621; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  button { cursor:pointer; font-family:inherit; }
  input { font-family:inherit; }
  .screen { display:none; flex-direction:column; height:100dvh; }
  .screen.active { display:flex; }
  header { background:#17212b; padding:12px 14px; display:flex; align-items:center; gap:10px; flex-shrink:0; border-bottom:1px solid #0e1621; min-height:56px; }
  header h2 { font-size:18px; margin:0; flex:1; font-weight:600; }
  header .icon-btn { background:transparent; border:0; color:#7fa9d1; padding:8px; font-size:20px; line-height:1; border-radius:50%; }
  header .icon-btn:active { background:#232e3c; }
  header .back { color:#7fa9d1; font-size:24px; padding:6px 10px 6px 0; }
  #login { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100dvh; gap:20px; padding:24px; text-align:center; background:#0e1621; }
  #login .logo { width:88px; height:88px; border-radius:50%; background:linear-gradient(135deg,#5288c1,#2b5278); display:flex; align-items:center; justify-content:center; font-size:44px; }
  #login h1 { margin:0; font-size:28px; }
  #login p { opacity:.6; margin:0; max-width:280px; }
  #login button { padding:14px 28px; border-radius:24px; border:0; background:#5288c1; color:#fff; font-size:15px; font-weight:600; }
  #login .err { color:#e74c3c; font-size:13px; margin-top:10px; max-width:300px; }
  .content { flex:1; overflow-y:auto; }
  .tab { display:none; height:100%; overflow-y:auto; }
  .tab.active { display:block; }
  .item { padding:12px 16px; display:flex; align-items:center; gap:14px; border-bottom:1px solid #17212b; cursor:pointer; }
  .item:active { background:#17212b; }
  .item .avatar { width:52px; height:52px; border-radius:50%; background:#2b5278; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; color:#fff; overflow:hidden; }
  .item .avatar img { width:100%; height:100%; object-fit:cover; }
  .item .info { flex:1; min-width:0; }
  .item .name { font-weight:600; font-size:15px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .sub { font-size:13px; color:#7d8e9e; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .meta { font-size:12px; color:#7d8e9e; text-align:right; align-self:flex-start; padding-top:2px; flex-shrink:0; }
  .empty { padding:60px 24px; text-align:center; color:#7d8e9e; font-size:14px; }
  .empty .big { font-size:48px; margin-bottom:12px; opacity:.5; }
  .bottom-nav { display:flex; background:#17212b; border-top:1px solid #0e1621; flex-shrink:0; padding:6px 0 env(safe-area-inset-bottom, 6px) 0; }
  .bottom-nav button { flex:1; background:transparent; border:0; color:#7d8e9e; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; font-size:11px; font-weight:500; }
  .bottom-nav button .ico { font-size:22px; line-height:1; }
  .bottom-nav button.active { color:#5288c1; }
  #messages { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; background:#0e1621; }
  .msg { max-width:80%; padding:8px 12px; border-radius:14px; background:#182533; word-wrap:break-word; font-size:15px; line-height:1.35; }
  .msg.mine { align-self:flex-end; background:#2b5278; }
  .msg .author { font-size:12px; color:#5288c1; margin-bottom:3px; font-weight:600; }
  .msg .time { font-size:11px; color:#7d8e9e; text-align:right; margin-top:2px; }
  .msg.mine .time { color:#a9c8e2; }
  form.composer { display:flex; gap:8px; padding:10px 12px; background:#17212b; border-top:1px solid #0e1621; flex-shrink:0; padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px)); }
  form.composer input { flex:1; padding:12px 16px; border-radius:22px; border:0; background:#232e3c; color:#fff; font-size:15px; outline:none; }
  form.composer button { width:46px; height:46px; border-radius:50%; border:0; background:#5288c1; color:#fff; font-size:18px; flex-shrink:0; }
  .settings-block { background:#17212b; margin:10px 0; }
  .settings-block .profile { padding:24px 16px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .settings-block .profile .avatar { width:88px; height:88px; border-radius:50%; background:#2b5278; display:flex; align-items:center; justify-content:center; font-size:36px; overflow:hidden; }
  .settings-block .profile .avatar img { width:100%; height:100%; object-fit:cover; }
  .settings-block .profile .pname { font-size:20px; font-weight:600; }
  .settings-block .profile .pemail { font-size:13px; color:#7d8e9e; }
  .settings-row { padding:16px; display:flex; align-items:center; gap:14px; border-top:1px solid #0e1621; cursor:pointer; }
  .settings-row:active { background:#1e2a38; }
  .settings-row .ico { font-size:20px; width:24px; text-align:center; color:#7fa9d1; }
  .settings-row .label { flex:1; font-size:15px; }
  .settings-row .val { color:#7d8e9e; font-size:14px; }
  .settings-row.danger .ico, .settings-row.danger .label { color:#e74c3c; }
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; align-items:center; justify-content:center; padding:20px; }
  .modal.active { display:flex; }
  .modal-box { background:#17212b; padding:20px; border-radius:14px; width:100%; max-width:360px; max-height:80vh; overflow-y:auto; }
  .modal-box h3 { margin:0 0 14px; font-size:18px; }
  .modal-box input { width:100%; padding:12px; border-radius:10px; border:1px solid #2b3a4a; background:#232e3c; color:#fff; font-size:15px; outline:none; margin-bottom:10px; }
  .modal-box .m-actions { display:flex; gap:8px; margin-top:8px; }
  .modal-box .m-actions button { flex:1; padding:12px; border-radius:10px; border:0; font-size:15px; font-weight:600; }
  .btn-primary { background:#5288c1; color:#fff; }
  .btn-secondary { background:#232e3c; color:#fff; }
  .user-pick { padding:10px 12px; display:flex; align-items:center; gap:12px; border-radius:8px; cursor:pointer; }
  .user-pick:active { background:#232e3c; }
  .user-pick.selected { background:#2b5278; }
  .user-pick .avatar { width:40px; height:40px; border-radius:50%; background:#2b5278; display:flex; align-items:center; justify-content:center; font-size:16px; overflow:hidden; flex-shrink:0; }
  .user-pick .avatar img { width:100%; height:100%; object-fit:cover; }
  .user-pick .nm { flex:1; font-size:14px; }
  .user-pick .chk { width:22px; height:22px; border-radius:50%; border:2px solid #5288c1; display:flex; align-items:center; justify-content:center; font-size:14px; color:transparent; }
  .user-pick.selected .chk { background:#5288c1; color:#fff; }
</style>
</head>
<body>

<div id="login" class="screen active">
  <div class="logo">💬</div>
  <h1>MyChat</h1>
  <p>Свой мессенджер. Войди через Google, чтобы начать общаться со всем миром.</p>
  <button id="googleBtn">Войти через Google</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="mainScreen" class="screen">
  <header>
    <h2 id="headerTitle">MyChat</h2>
    <button class="icon-btn" id="newChatBtn" title="Новый чат">✏️</button>
  </header>
  <div class="content">
    <div id="chatsTab" class="tab active"><div id="chatsList"></div></div>
    <div id="peopleTab" class="tab"><div id="peopleList"></div></div>
    <div id="settingsTab" class="tab">
      <div class="settings-block">
        <div class="profile">
          <div class="avatar" id="setAvatar"></div>
          <div class="pname" id="setName">…</div>
          <div class="pemail" id="setEmail">…</div>
        </div>
      </div>
      <div class="settings-block">
        <div class="settings-row" id="rowEditName">
          <div class="ico">✏️</div><div class="label">Изменить имя</div><div class="val" id="curName">…</div>
        </div>
        <div class="settings-row">
          <div class="ico">ℹ️</div><div class="label">О приложении</div><div class="val">v2.0</div>
        </div>
      </div>
      <div class="settings-block">
        <div class="settings-row danger" id="rowLogout">
          <div class="ico">🚪</div><div class="label">Выйти из аккаунта</div>
        </div>
      </div>
    </div>
  </div>
  <nav class="bottom-nav">
    <button data-tab="chatsTab" class="active"><span class="ico">💬</span><span>Чаты</span></button>
    <button data-tab="peopleTab"><span class="ico">👥</span><span>Люди</span></button>
    <button data-tab="settingsTab"><span class="ico">⚙️</span><span>Настройки</span></button>
  </nav>
</div>

<div id="chatScreen" class="screen">
  <header>
    <button class="back icon-btn" id="backBtn">←</button>
    <div id="chatAvatar" style="width:36px;height:36px;border-radius:50%;background:#2b5278;display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;"></div>
    <h2 id="chatTitle" style="font-size:16px;">…</h2>
  </header>
  <div id="messages"></div>
  <form class="composer" id="form">
    <input id="input" placeholder="Сообщение…" autocomplete="off" maxlength="500">
    <button type="submit">➤</button>
  </form>
</div>

<div class="modal" id="newChatModal">
  <div class="modal-box">
    <h3>Новый чат</h3>
    <input id="newRoomName" placeholder="Название группы (если групповой)">
    <div style="font-size:13px;color:#7d8e9e;margin-bottom:8px;">Выбери участников:</div>
    <div id="userPickerList" style="max-height:40vh;overflow-y:auto;"></div>
    <div class="m-actions">
      <button class="btn-secondary" id="cancelNewChat">Отмена</button>
      <button class="btn-primary" id="createChat">Создать</button>
    </div>
  </div>
</div>

<div class="modal" id="editNameModal">
  <div class="modal-box">
    <h3>Изменить имя</h3>
    <input id="editNameInput" placeholder="Твоё имя" maxlength="40">
    <div class="m-actions">
      <button class="btn-secondary" id="cancelEditName">Отмена</button>
      <button class="btn-primary" id="saveEditName">Сохранить</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, push, set, get, update, onValue, onChildAdded, onDisconnect, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA7W1Aa0-6ArSM3rJ1B-RsfXzkKnJlFbvg",
  authDomain: "mychat-9f629.firebaseapp.com",
  databaseURL: "https://mychat-9f629-default-rtdb.europe-west1.firebasedatabase.app/",
  projectId: "mychat-9f629",
  storageBucket: "mychat-9f629.firebasestorage.app",
  messagingSenderId: "175226507843",
  appId: "1:175226507843:web:0be69688dbef0d4bd9baf6",
  measurementId: "G-4J4S8LSRSC"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

const $ = id => document.getElementById(id);
let me = null, myProfile = null, allUsers = {}, myChats = [], currentChat = null, msgUnsub = null, pickerSelected = {};

function showError(msg) {
  const e = $('loginErr');
  if (e) e.textContent = msg;
  console.error(msg);
}

$('googleBtn').onclick = async () => {
  $('loginErr').textContent = '';
  $('googleBtn').textContent = 'Загрузка…';
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    console.error('Popup error:', e.code, e.message);
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') {
      try {
        await signInWithRedirect(auth, provider);
      } catch (e2) {
        showError('Ошибка редиректа: ' + e2.code + ' — ' + e2.message);
        $('googleBtn').textContent = 'Войти через Google';
      }
    } else if (e.code === 'auth/unauthorized-domain') {
      showError('Домен не разрешён в Firebase → Authentication → Settings → Authorized domains. Добавь: mychat-pied-ten.vercel.app');
      $('googleBtn').textContent = 'Войти через Google';
    } else if (e.code === 'auth/operation-not-allowed') {
      showError('Вход через Google отключён. Firebase → Authentication → Sign-in method → Google → Enable.');
      $('googleBtn').textContent = 'Войти через Google';
    } else {
      showError('Ошибка: ' + e.code + ' — ' + e.message);
      $('googleBtn').textContent = 'Войти через Google';
    }
  }
};

getRedirectResult(auth).then(r => {
  if (r && r.user) console.log('Вход через редирект:', r.user.email);
}).catch(e => {
  console.error('Redirect result error:', e.code, e.message);
  if (e.code !== 'auth/no-auth-event') showError('Ошибка: ' + e.code + ' — ' + e.message);
});

onAuthStateChanged(auth, async user => {
  if (!user) {
    me = null; myProfile = null;
    $('login').classList.add('active');
    document.querySelectorAll('.screen').forEach(s => { if (s.id !== 'login') s.classList.remove('active'); });
    $('googleBtn').textContent = 'Войти через Google';
    return;
  }
  me = user;
  $('loginErr').textContent = '';
  try {
    const userRef = ref(db, `users/${user.uid}`);
    const snap = await get(userRef);
    const existing = snap.val() || {};
    myProfile = {
      name: existing.name || user.displayName || (user.email ? user.email.split('@')[0] : 'User'),
      photo: existing.photo || user.photoURL || '',
      email: user.email || '',
      lastSeen: Date.now()
    };
    await set(userRef, myProfile);
    const onlineRef = ref(db, `users/${user.uid}/online`);
    await set(onlineRef, true);
    onDisconnect(onlineRef).set(false);
  } catch (e) {
    console.error('Save user error:', e);
    showError('Не сохранить профиль: ' + e.message + '. Проверь Rules в Firebase.');
    return;
  }
  $('login').classList.remove('active');
  $('mainScreen').classList.add('active');
  renderSettings();
  watchUsers();
  watchChats();
});

function watchUsers() {
  onValue(ref(db, 'users'), snap => {
    allUsers = snap.val() || {};
    renderPeople();
    renderChats();
  });
}

function renderPeople() {
  const list = $('peopleList');
  const arr = Object.entries(allUsers).filter(([uid]) => uid !== me.uid).map(([uid, u]) => ({ uid, ...u }));
  if (arr.length === 0) { list.innerHTML = `<div class="empty"><div class="big">👥</div>Пока никого нет.<br>Скинь друзьям ссылку на сайт!</div>`; return; }
  list.innerHTML = '';
  arr.forEach(u => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<div class="avatar">${avatarHTML(u)}</div><div class="info"><div class="name">${esc(u.name)} ${u.online ? '<span style="color:#4caf50;font-size:11px;">● онлайн</span>' : ''}</div><div class="sub">${esc(u.email || '')}</div></div>`;
    div.onclick = () => openPrivateChat(u.uid);
    list.appendChild(div);
  });
}

function watchChats() {
  onValue(ref(db, 'chats'), snap => {
    const all = snap.val() || {};
    myChats = Object.entries(all).filter(([id, c]) => c.members && c.members[me.uid]).map(([id, c]) => ({ id, ...c })).sort((a, b) => (b.lastTime || 0) - (a.lastTime || 0));
    renderChats();
  });
}

function renderChats() {
  const list = $('chatsList');
  if (myChats.length === 0) { list.innerHTML = `<div class="empty"><div class="big">💬</div>Пока нет чатов.<br>Нажми ✏️ сверху, чтобы начать.</div>`; return; }
  list.innerHTML = '';
  myChats.forEach(c => {
    const div = document.createElement('div');
    div.className = 'item';
    const isPrivate = c.type === 'private';
    const otherUid = isPrivate ? Object.keys(c.members).find(u => u !== me.uid) : null;
    const other = otherUid ? allUsers[otherUid] : null;
    const title = isPrivate ? (other ? other.name : 'Пользователь') : (c.name || 'Группа');
    const sub = c.lastMessage ? `${c.lastUid === me.uid ? 'Вы: ' : (c.lastName ? c.lastName + ': ' : '')}${esc(c.lastMessage)}` : 'Нет сообщений';
    const t = c.lastTime ? timeShort(c.lastTime) : '';
    const av = isPrivate && other ? (other.photo ? `<img src="${esc(other.photo)}">` : esc((other.name || '?')[0].toUpperCase())) : (isPrivate ? '?' : '👥');
    div.innerHTML = `<div class="avatar">${av}</div><div class="info"><div class="name">${esc(title)}</div><div class="sub">${sub}</div></div><div class="meta">${t}</div>`;
    div.onclick = () => openChat(c.id, title, other, c);
    list.appendChild(div);
  });
}

async function openPrivateChat(otherUid) {
  const chatId = [me.uid, otherUid].sort().join('_');
  const chatRef = ref(db, `chats/${chatId}`);
  const snap = await get(chatRef);
  if (!snap.exists()) {
    await set(chatRef, { type: 'private', members: { [me.uid]: true, [otherUid]: true }, createdAt: Date.now(), lastTime: Date.now() });
  }
  const other = allUsers[otherUid];
  openChat(chatId, other ? other.name : 'Чат', other, { type: 'private', members: { [me.uid]: true, [otherUid]: true } });
  switchTab('chatsTab');
}

function openChat(chatId, title, otherUser, chatData) {
  currentChat = { id: chatId, title, otherUser, data: chatData };
  $('chatTitle').textContent = title;
  const av = $('chatAvatar');
  if (otherUser) { av.innerHTML = otherUser.photo ? `<img src="${esc(otherUser.photo)}" style="width:100%;height:100%;object-fit:cover;">` : esc((otherUser.name || '?')[0].toUpperCase()); }
  else av.innerHTML = '👥';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('chatScreen').classList.add('active');
  const msgsEl = $('messages');
  msgsEl.innerHTML = '';
  if (msgUnsub) msgUnsub();
  const q = query(ref(db, `messages/${chatId}`), limitToLast(200));
  msgUnsub = onChildAdded(q, snap => {
    const m = snap.val();
    const div = document.createElement('div');
    div.className = 'msg' + (m.uid === me.uid ? ' mine' : '');
    const t = m.time ? new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
    const showAuthor = !currentChat.data || currentChat.data.type !== 'private';
    div.innerHTML = `${showAuthor && m.uid !== me.uid ? `<div class="author">${esc(m.name)}</div>` : ''}${esc(m.text)}<div class="time">${t}</div>`;
    msgsEl.appendChild(div);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  });
}

$('backBtn').onclick = () => {
  if (msgUnsub) { msgUnsub(); msgUnsub = null; }
  currentChat = null;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('mainScreen').classList.add('active');
};

$('form').onsubmit = async e => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text || !currentChat) return;
  $('input').value = '';
  await push(ref(db, `messages/${currentChat.id}`), { uid: me.uid, name: myProfile.name, text, time: Date.now() });
  await update(ref(db, `chats/${currentChat.id}`), { lastMessage: text.slice(0, 100), lastName: myProfile.name, lastUid: me.uid, lastTime: Date.now() });
};

document.querySelectorAll('.bottom-nav button').forEach(btn => { btn.onclick = () => switchTab(btn.dataset.tab); });

function switchTab(tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === tabId));
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
  const titles = { chatsTab: 'MyChat', peopleTab: 'Все люди', settingsTab: 'Настройки' };
  $('headerTitle').textContent = titles[tabId] || 'MyChat';
}

$('newChatBtn').onclick = () => { pickerSelected = {}; $('newRoomName').value = ''; renderUserPicker(); $('newChatModal').classList.add('active'); };
$('cancelNewChat').onclick = () => $('newChatModal').classList.remove('active');
$('newChatModal').onclick = e => { if (e.target.id === 'newChatModal') $('newChatModal').classList.remove('active'); };

function renderUserPicker() {
  const list = $('userPickerList');
  const arr = Object.entries(allUsers).filter(([uid]) => uid !== me.uid);
  if (arr.length === 0) { list.innerHTML = '<div style="padding:14px;color:#7d8e9e;font-size:14px;">Пока никого нет.</div>'; return; }
  list.innerHTML = '';
  arr.forEach(([uid, u]) => {
    const div = document.createElement('div');
    div.className = 'user-pick' + (pickerSelected[uid] ? ' selected' : '');
    div.innerHTML = `<div class="avatar">${u.photo ? `<img src="${esc(u.photo)}">` : esc((u.name || '?')[0].toUpperCase())}</div><div class="nm">${esc(u.name)}</div><div class="chk">✓</div>`;
    div.onclick = () => { pickerSelected[uid] = !pickerSelected[uid]; renderUserPicker(); };
    list.appendChild(div);
  });
}

$('createChat').onclick = async () => {
  const selected = Object.keys(pickerSelected).filter(u => pickerSelected[u]);
  const groupName = $('newRoomName').value.trim();
  if (selected.length === 0) { alert('Выбери хотя бы одного человека'); return; }
  if (selected.length === 1 && !groupName) { $('newChatModal').classList.remove('active'); openPrivateChat(selected[0]); return; }
  const members = { [me.uid]: true };
  selected.forEach(uid => members[uid] = true);
  const chatRef = push(ref(db, 'chats'));
  await set(chatRef, { type: 'group', name: groupName || 'Группа', members, createdBy: me.uid, createdAt: Date.now(), lastTime: Date.now() });
  $('newChatModal').classList.remove('active');
  openChat(chatRef.key, groupName || 'Группа', null, { type: 'group' });
  switchTab('chatsTab');
};

function renderSettings() {
  $('setName').textContent = myProfile.name;
  $('setEmail').textContent = myProfile.email;
  $('curName').textContent = myProfile.name;
  const av = $('setAvatar');
  av.innerHTML = myProfile.photo ? `<img src="${esc(myProfile.photo)}" style="width:100%;height:100%;object-fit:cover;">` : esc((myProfile.name || '?')[0].toUpperCase());
}

$('rowEditName').onclick = () => { $('editNameInput').value = myProfile.name; $('editNameModal').classList.add('active'); setTimeout(() => $('editNameInput').focus(), 100); };
$('cancelEditName').onclick = () => $('editNameModal').classList.remove('active');
$('editNameModal').onclick = e => { if (e.target.id === 'editNameModal') $('editNameModal').classList.remove('active'); };
$('saveEditName').onclick = async () => {
  const newName = $('editNameInput').value.trim();
  if (!newName) return;
  myProfile.name = newName;
  await update(ref(db, `users/${me.uid}`), { name: newName });
  renderSettings();
  $('editNameModal').classList.remove('active');
};
$('rowLogout').onclick = () => { if (confirm('Выйти из аккаунта?')) signOut(auth); };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function avatarHTML(u) { if (!u) return '?'; if (u.photo) return `<img src="${esc(u.photo)}">`; return esc((u.name || '?')[0].toUpperCase()); }
function timeShort(ts) { const d = new Date(ts); const now = new Date(); if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); return d.toLocaleDateString([], {day:'2-digit', month:'2-digit'}); }
</script>
