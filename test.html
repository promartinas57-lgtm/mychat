<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Test</title>
<style>body{font-family:sans-serif;padding:20px;background:#111;color:#eee;font-size:16px;line-height:1.6}
.ok{color:#4caf50}.err{color:#e74c3c}</style></head>
<body>
<h2>MyChat Test</h2>
<div id="out">Запуск…</div>
<script type="module">
const out = document.getElementById('out');
const log = (t, cls='') => { out.innerHTML += `<div class="${cls}">${t}</div>`; };

log('1. Проверка связи с Firebase...');
try {
  const r = await fetch('https://mychat-9f629-default-rtdb.europe-west1.firebasedatabase.app/.json?shallow=true');
  if (r.ok) log('✅ Firebase отвечает (код ' + r.status + ')', 'ok');
  else log('❌ Firebase ответил ошибкой ' + r.status, 'err');
} catch (e) {
  log('❌ Нет связи с Firebase: ' + e.message, 'err');
  log('👉 Это VPN блокирует.', 'err');
}

log('2. Проверка Google...');
try {
  const r2 = await fetch('https://accounts.google.com/.well-known/openid-configuration');
  if (r2.ok) log('✅ Google доступен', 'ok');
  else log('❌ Google ответил ' + r2.status, 'err');
} catch (e) {
  log('❌ Нет связи с Google: ' + e.message, 'err');
  log('👉 Google блокируется через VPN. Это норма для РФ.', 'err');
}

log('3. Проверка Firebase Auth SDK...');
try {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
  log('✅ Firebase SDK загружается', 'ok');
} catch (e) {
  log('❌ SDK не грузится: ' + e.message, 'err');
}

log('Готово!');
</script>
</body></html>
